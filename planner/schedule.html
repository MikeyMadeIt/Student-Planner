<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-theme="dark" data-accent="violet">
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar">
      <div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div>
    </div>
    <div class="topbar">
      <div><h1 class="page-title">Schedule Manager</h1><p class="page-sub">All your subjects, one place</p></div>
      <button class="btn btn-accent" onclick="openSubjectModal()"><i class="bi bi-plus-lg me-1"></i>Add Subject</button>
    </div>

    <!-- Controls -->
    <div class="glass card-pad mb-3 fade-in">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <input class="form-control" id="searchInput" placeholder="Search subject, professor, room…">
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select" id="filterDay">
            <option value="">All Days</option>
            <option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select" id="sortBy">
            <option value="time">Sort: Time</option>
            <option value="code">Sort: Code</option>
            <option value="professor">Sort: Professor</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select" id="semesterSelect"></select>
        </div>
        <div class="col-6 col-md-2 d-flex gap-2">
          <button class="btn-icon flex-grow-1" title="Show archived" id="archiveToggleBtn" onclick="toggleArchivedView()"><i class="bi bi-archive"></i></button>
        </div>
      </div>
      <div class="btn-group mt-3" role="group">
        <button class="btn btn-ghost btn-sm active" data-view="card" onclick="switchView('card')"><i class="bi bi-grid-3x3-gap me-1"></i>Cards</button>
        <button class="btn btn-ghost btn-sm" data-view="timetable" onclick="switchView('timetable')"><i class="bi bi-calendar2-week me-1"></i>Weekly Timetable</button>
        <button class="btn btn-ghost btn-sm" data-view="timeline" onclick="switchView('timeline')"><i class="bi bi-list-ol me-1"></i>Timeline</button>
      </div>
    </div>

    <!-- CARD VIEW -->
    <div id="cardView" class="row g-3 stagger"></div>

    <!-- TIMETABLE VIEW -->
    <div id="timetableView" class="glass card-pad d-none fade-in">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="section-title mb-0"><i class="bi bi-calendar2-week"></i>Weekly Timetable</div>
        <div class="d-flex gap-2">
          <button class="btn-icon" onclick="ttZoom(-1)"><i class="bi bi-zoom-out"></i></button>
          <button class="btn-icon" onclick="ttZoom(1)"><i class="bi bi-zoom-in"></i></button>
          <button class="btn-icon" onclick="window.print()"><i class="bi bi-printer"></i></button>
        </div>
      </div>
      <div class="scroll-x grabbable">
        <div id="ttGrid" style="min-width:760px"></div>
      </div>
    </div>

    <!-- TIMELINE VIEW -->
    <div id="timelineView" class="glass card-pad d-none fade-in"></div>

  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- Subject Modal -->
<div class="modal fade" id="subjectModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="subjectModalTitle">Add Subject</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="subjectModalBody"></div>
    </div>
  </div>
</div>

<!-- Subject Detail Modal (timetable click) -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content card-pad" id="detailModalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/schedule.js"></script>
<script>
  renderShell('schedule');
  applyTheme();
  initSchedule();
</script>
</body>
</html>
