<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-theme="dark" data-accent="violet">
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Calendar</h1><p class="page-sub" id="calSubtitle">This month</p></div>
      <div class="d-flex gap-2">
        <div class="btn-group">
          <button class="btn btn-ghost btn-sm active" data-mode="month" onclick="setCalMode('month')">Month</button>
          <button class="btn btn-ghost btn-sm" data-mode="week" onclick="setCalMode('week')">Week</button>
          <button class="btn btn-ghost btn-sm" data-mode="day" onclick="setCalMode('day')">Day</button>
        </div>
      </div>
    </div>

    <div class="glass card-pad mb-3 fade-in">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn-icon" onclick="navCal(-1)"><i class="bi bi-chevron-left"></i></button>
        <h4 class="mb-0" id="calTitle"></h4>
        <button class="btn-icon" onclick="navCal(1)"><i class="bi bi-chevron-right"></i></button>
      </div>
      <div id="calBody"></div>
    </div>

    <div class="glass card-pad fade-in">
      <div class="section-title"><i class="bi bi-list-check"></i>Legend</div>
      <div class="d-flex gap-3 flex-wrap" style="font-size:.8rem">
        <span><span class="dot-color d-inline-block" style="background:#7C6CF6"></span> Classes</span>
        <span><span class="dot-color d-inline-block" style="background:#FBBF24"></span> Homework</span>
        <span><span class="dot-color d-inline-block" style="background:#4F8CFF"></span> Project</span>
        <span><span class="dot-color d-inline-block" style="background:#22D3EE"></span> Quiz</span>
        <span><span class="dot-color d-inline-block" style="background:#FB7185"></span> Exam</span>
        <span><span class="dot-color d-inline-block" style="background:#34D399"></span> Personal</span>
      </div>
    </div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal fade" id="dayModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content card-pad" id="dayModalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/calendar.js"></script>
<script>
  renderShell('calendar');
  applyTheme();
  initCalendar();
</script>
</body>
</html>
