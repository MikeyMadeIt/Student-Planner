<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-theme="dark" data-accent="violet">
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Attendance Tracker</h1><p class="page-sub">Log attendance per subject and track your rate</p></div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-4"><div class="glass card-pad fade-in"><div class="section-title"><i class="bi bi-percent"></i>Semester Attendance</div><div class="stat-num" id="aRate">--%</div><div class="progress my-2"><div class="progress-bar" id="aRateBar" style="width:0%"></div></div></div></div>
      <div class="col-md-8">
        <div class="glass card-pad fade-in">
          <div class="section-title"><i class="bi bi-plus-circle"></i>Log Attendance</div>
          <div class="row g-2">
            <div class="col-md-4"><select class="form-select" id="attSubject"></select></div>
            <div class="col-md-3"><input type="date" class="form-control" id="attDate" value=""></div>
            <div class="col-md-3">
              <select class="form-select" id="attStatus">
                <option>Present</option><option>Absent</option><option>Late</option><option>Excused</option>
              </select>
            </div>
            <div class="col-md-2"><button class="btn btn-accent w-100" onclick="logAttendance()">Log</button></div>
          </div>
        </div>
      </div>
    </div>

    <div class="glass card-pad mb-3 fade-in">
      <div class="section-title"><i class="bi bi-bar-chart-steps"></i>Subject Ranking</div>
      <div id="subjectRanking"></div>
    </div>

    <div class="glass card-pad fade-in">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0"><i class="bi bi-list-ul"></i>Attendance Log</div>
      </div>
      <div id="attendanceLog" style="max-height:320px;overflow-y:auto"></div>
    </div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/attendance.js"></script>
<script>
  renderShell('attendance');
  applyTheme();
  initAttendance();
</script>
</body>
</html>
