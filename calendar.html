<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Calendar</h1><p class="page-sub" id="calSubtitle">Schedule, tasks, and university dates in one place</p></div>
    </div>

    <!-- SCHEDULE CALENDAR -->
    <div class="glass card-pad mb-3 fade-in">
      <div class="section-title"><i class="bi bi-calendar3"></i>Schedule Calendar</div>
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="btn-group">
          <button class="btn btn-ghost btn-sm active" data-mode="month" onclick="setCalMode('month')">Month</button>
          <button class="btn btn-ghost btn-sm" data-mode="week" onclick="setCalMode('week')">Week</button>
          <button class="btn btn-ghost btn-sm" data-mode="day" onclick="setCalMode('day')">Day</button>
        </div>
        <button class="btn btn-accent btn-sm" onclick="openScheduleModal()"><i class="bi bi-plus-lg me-1"></i>Add Schedule</button>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn-icon" onclick="navCal(-1)"><i class="bi bi-chevron-left"></i></button>
        <h4 class="mb-0" id="calTitle"></h4>
        <button class="btn-icon" onclick="navCal(1)"><i class="bi bi-chevron-right"></i></button>
      </div>
      <div id="calBody"></div>
    </div>

    <!-- TASK CALENDAR -->
    <div class="glass card-pad mb-3 fade-in">
      <div class="section-title"><i class="bi bi-check2-square"></i>Task Calendar</div>
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="btn-group">
          <button class="btn btn-ghost btn-sm active" data-tcmode="month" onclick="setTaskCalMode('month')">Month</button>
          <button class="btn btn-ghost btn-sm" data-tcmode="week" onclick="setTaskCalMode('week')">Week</button>
          <button class="btn btn-ghost btn-sm" data-tcmode="day" onclick="setTaskCalMode('day')">Day</button>
        </div>
        <button class="btn btn-accent btn-sm" onclick="openTaskModal()"><i class="bi bi-plus-lg me-1"></i>Add Task</button>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn-icon" onclick="navTaskCal(-1)"><i class="bi bi-chevron-left"></i></button>
        <h4 class="mb-0" id="taskCalTitle"></h4>
        <button class="btn-icon" onclick="navTaskCal(1)"><i class="bi bi-chevron-right"></i></button>
      </div>
      <div id="taskCalBody" class="mb-3"></div>

      <div class="section-title" id="taskListTitle"><i class="bi bi-list-task"></i>Tasks This Month</div>
      <div id="taskCalList"></div>
    </div>

    <!-- SEPARATE UNIVERSITY CALENDAR -->
    <div class="glass card-pad fade-in">
      <div class="section-title"><i class="bi bi-bank2"></i>University Calendar</div>
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="btn-group">
          <button class="btn btn-ghost btn-sm active" data-ucmode="month" onclick="setUnivCalMode('month')">Month</button>
          <button class="btn btn-ghost btn-sm" data-ucmode="week" onclick="setUnivCalMode('week')">Week</button>
          <button class="btn btn-ghost btn-sm" data-ucmode="day" onclick="setUnivCalMode('day')">Day</button>
        </div>
        <button class="btn btn-accent btn-sm" onclick="openUnivEventModal()"><i class="bi bi-plus-lg me-1"></i>Add Event</button>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn-icon" onclick="navUnivCal(-1)"><i class="bi bi-chevron-left"></i></button>
        <h4 class="mb-0" id="univCalTitle"></h4>
        <button class="btn-icon" onclick="navUnivCal(1)"><i class="bi bi-chevron-right"></i></button>
      </div>
      <div id="univCalBody" class="mb-3"></div>

      <div class="section-title" id="univListTitle"><i class="bi bi-calendar-event"></i>Events This Month</div>
      <div id="univEventList"></div>
    </div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal fade" id="dayModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="dayModalBody"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Schedule Modal -->
<div class="modal fade" id="calSubjectModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="calSubjectModalBody"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Task Modal -->
<div class="modal fade" id="calTaskModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="calTaskModalBody"></div>
    </div>
  </div>
</div>

<!-- University Event Modal -->
<div class="modal fade" id="univEventModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="univEventModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/calendar.js"></script>
<script>
  renderShell('calendar');
  applyTheme();
  initCalendar();
</script>
</body>
</html>
