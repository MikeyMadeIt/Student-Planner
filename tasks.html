<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Tasks &amp; Assignments</h1><p class="page-sub">Homework, projects, quizzes and exams — all tracked together</p></div>
      <button class="btn btn-accent" onclick="openTaskModal()"><i class="bi bi-plus-lg me-1"></i>Add Task</button>
    </div>

    <div class="glass card-pad mb-3 fade-in">
      <div class="row g-2">
        <div class="col-md-4"><input class="form-control" id="taskSearch" placeholder="Search tasks…"></div>
        <div class="col-6 col-md-2"><select class="form-select" id="taskCatFilter"><option value="">All Categories</option><option>Homework</option><option>Project</option><option>Quiz</option><option>Exam</option><option>Personal</option><option>Organization</option></select></div>
        <div class="col-6 col-md-2"><select class="form-select" id="taskPriFilter"><option value="">All Priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div>
        <div class="col-6 col-md-2"><select class="form-select" id="taskSort"><option value="due">Sort: Due Date</option><option value="priority">Sort: Priority</option><option value="created">Sort: Created</option></select></div>
        <div class="col-6 col-md-2">
          <div class="btn-group w-100">
            <button class="btn btn-ghost btn-sm active" data-tview="list" onclick="switchTaskView('list')"><i class="bi bi-list-task"></i></button>
            <button class="btn btn-ghost btn-sm" data-tview="board" onclick="switchTaskView('board')"><i class="bi bi-kanban"></i></button>
          </div>
        </div>
      </div>
    </div>

    <!-- LIST VIEW -->
    <div id="taskListView">
      <div class="glass card-pad fade-in" id="taskListWrap"></div>
    </div>

    <!-- BOARD (DRAG & DROP) VIEW -->
    <div id="taskBoardView" class="row g-3 d-none">
      <div class="col-md-4"><div class="glass card-pad">
        <div class="section-title"><i class="bi bi-circle"></i>Not Started</div>
        <div class="kanban-col" data-status="not-started" ondrop="onDrop(event)" ondragover="event.preventDefault()"></div>
      </div></div>
      <div class="col-md-4"><div class="glass card-pad">
        <div class="section-title"><i class="bi bi-hourglass-split"></i>In Progress</div>
        <div class="kanban-col" data-status="in-progress" ondrop="onDrop(event)" ondragover="event.preventDefault()"></div>
      </div></div>
      <div class="col-md-4"><div class="glass card-pad">
        <div class="section-title"><i class="bi bi-check-circle"></i>Completed</div>
        <div class="kanban-col" data-status="completed" ondrop="onDrop(event)" ondragover="event.preventDefault()"></div>
      </div></div>
    </div>

    <div class="glass card-pad mt-3 fade-in">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0"><i class="bi bi-clock-history"></i>Completed History</div>
      </div>
      <div id="completedHistory" style="max-height:220px;overflow-y:auto"></div>
    </div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="taskModalTitle">Add Task</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="taskModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/tasks.js"></script>
<script>
  renderShell('tasks');
  applyTheme();
  initTasks();
</script>
</body>
</html>
