<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Notes</h1><p class="page-sub">Markdown-friendly notes with pins, favorites &amp; checklists</p></div>
      <button class="btn btn-accent" onclick="openNoteModal()"><i class="bi bi-plus-lg me-1"></i>New Note</button>
    </div>

    <div class="glass card-pad mb-3 fade-in">
      <div class="row g-2">
        <div class="col-md-5"><input class="form-control" id="noteSearch" placeholder="Search notes…"></div>
        <div class="col-6 col-md-3"><select class="form-select" id="noteCatFilter"><option value="">All Categories</option><option>Homework</option><option>Project</option><option>Personal</option><option>Organization</option><option>Ideas</option></select></div>
        <div class="col-6 col-md-2"><button class="btn-ghost btn w-100" id="favFilterBtn" onclick="toggleFavFilter()"><i class="bi bi-star"></i> Favorites</button></div>
      </div>
    </div>

    <div id="notesGrid" class="row g-3 stagger"></div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal fade" id="noteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="noteModalTitle">New Note</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="noteModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/notes.js"></script>
<script>
  renderShell('notes');
  applyTheme();
  initNotes();
</script>
</body>
</html>
