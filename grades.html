<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grades · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Grade Tracker</h1><p class="page-sub">Quiz, activity, lab, project, midterm &amp; finals scores</p></div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-4"><div class="glass card-pad fade-in"><div class="section-title"><i class="bi bi-mortarboard-fill"></i>Overall GPA</div><div class="stat-num" id="gGpa">--</div><div class="text-faint" style="font-size:.78rem">4.0 scale</div></div></div>
      <div class="col-md-4"><div class="glass card-pad fade-in"><div class="section-title"><i class="bi bi-graph-up-arrow"></i>Semester Standing</div><div class="stat-num" id="gStanding">--</div><div class="text-faint" style="font-size:.78rem" id="gStandingSub">Add scores to see standing</div></div></div>
      <div class="col-md-4"><div class="glass card-pad fade-in"><div class="section-title"><i class="bi bi-trophy-fill"></i>Top Subject</div><div class="stat-num" id="gTop" style="font-size:1.2rem">--</div><div class="text-faint" style="font-size:.78rem" id="gTopSub">Ranked by average</div></div></div>
    </div>

    <div id="gradesWrap" class="row g-3 stagger"></div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal fade" id="gradeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Edit Scores</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="gradeModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/grades.js"></script>
<script>
  renderShell('grades');
  applyTheme();
  initGrades();
</script>
</body>
</html>
