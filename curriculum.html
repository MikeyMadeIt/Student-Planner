<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curriculum · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>

    <!-- Page header -->
    <div class="topbar">
      <div>
        <h1 class="page-title">Curriculum</h1>
        <p class="page-sub">
          <span id="curProgram"></span>
          <span class="mx-1 text-faint">·</span>
          <span id="curVersion" class="chip chip-sm" style="font-size:.7rem;padding:2px 9px;vertical-align:middle"></span>
        </p>
      </div>
    </div>

    <!-- Stats + Search row -->
    <div class="cur-toolbar mb-3">
      <!-- Stats -->
      <div class="cur-stats-row">
        <div class="cur-stat-card glass">
          <div class="cur-stat-icon"><i class="bi bi-journal-text"></i></div>
          <div>
            <div class="cur-stat-val" id="curTotalSubjects">--</div>
            <div class="cur-stat-lbl">Subjects</div>
          </div>
        </div>
        <div class="cur-stat-card glass">
          <div class="cur-stat-icon"><i class="bi bi-lightning-charge-fill"></i></div>
          <div>
            <div class="cur-stat-val" id="curTotalUnits">--</div>
            <div class="cur-stat-lbl">Total Units</div>
          </div>
        </div>
        <div class="cur-stat-card glass">
          <div class="cur-stat-icon"><i class="bi bi-calendar4-range"></i></div>
          <div>
            <div class="cur-stat-val" id="curTotalYears">--</div>
            <div class="cur-stat-lbl">Years</div>
          </div>
        </div>
        <div class="cur-stat-card glass">
          <div class="cur-stat-icon"><i class="bi bi-collection"></i></div>
          <div>
            <div class="cur-stat-val" id="curTotalSemesters">--</div>
            <div class="cur-stat-lbl">Semesters</div>
          </div>
        </div>
      </div>
      <!-- Search -->
      <div class="cur-search-wrap">
        <i class="bi bi-search cur-search-icon"></i>
        <input id="curSearch" type="text" class="form-control cur-search-input"
               placeholder="Search course code, title, prerequisite…">
      </div>
    </div>

    <!-- Curriculum content -->
    <div id="curriculumContainer"></div>

  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/curriculum.js"></script>
<script>
  renderShell('curriculum');
  applyTheme();
  initCurriculum();
</script>
</body>
</html>
