<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallpaper Generator · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Wallpaper Generator</h1><p class="page-sub">A permanent schedule wallpaper — set once, use all semester</p></div>
    </div>

    <div class="row g-3">
      <div class="col-lg-4">
        <div class="glass card-pad fade-in mb-3">
          <div class="section-title"><i class="bi bi-palette-fill"></i>Theme</div>
          <div class="row row-cols-4 g-2" id="themePicker"></div>
        </div>
        <div class="glass card-pad fade-in mb-3">
          <div class="section-title"><i class="bi bi-aspect-ratio"></i>Size</div>
          <select class="form-select mb-2" id="wpSize">
            <option value="1080x2400">1080 × 2400 (Standard)</option>
            <option value="1440x3200">1440 × 3200 (QHD)</option>
            <option value="custom">Custom…</option>
          </select>
          <div class="row g-2 d-none" id="customSizeRow">
            <div class="col-6"><input type="number" class="form-control" id="wpW" placeholder="Width" value="1080"></div>
            <div class="col-6"><input type="number" class="form-control" id="wpH" placeholder="Height" value="2400"></div>
          </div>
        </div>
        <div class="glass card-pad fade-in mb-3">
          <div class="section-title"><i class="bi bi-toggles"></i>Include</div>
          <div id="wpToggles" style="font-size:.85rem"></div>
        </div>
        <div class="glass card-pad fade-in">
          <button class="btn btn-accent w-100 mb-2" onclick="generateWallpaper()"><i class="bi bi-magic me-1"></i>Generate Preview</button>
          <div class="d-flex gap-2">
            <button class="btn btn-ghost flex-grow-1" onclick="downloadWallpaper('png')"><i class="bi bi-download me-1"></i>PNG</button>
            <button class="btn btn-ghost flex-grow-1" onclick="downloadWallpaper('jpeg')"><i class="bi bi-download me-1"></i>JPG</button>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="glass card-pad fade-in text-center">
          <div class="section-title justify-content-center"><i class="bi bi-phone"></i>Preview</div>
          <div style="max-height:72vh;overflow:auto;display:inline-block;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.4)">
            <canvas id="wpCanvas" style="max-width:100%;max-height:72vh;border-radius:20px;display:block"></canvas>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/wallpaper.js"></script>
<script>
  renderShell('wallpaper');
  applyTheme();
  initWallpaper();
</script>
</body>
</html>
